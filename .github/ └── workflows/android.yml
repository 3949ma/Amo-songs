name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: "17"

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip unzip git autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install buildozer==1.5.0

    - name: Build Android APK
      run: |
        yes | buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AmoSongs-APK
        path: bin/*.apk
